description: >-
  Search file contents with system `grep` over the project's working tree (uncommitted edits
  included). Pass grep's own arguments in `args` (e.g. `-r`, `-n`, `-E`, pattern, paths) — the
  full grep CLI is available. POSIX regex; does NOT honor .gitignore. Runs in the project root;
  you MUST pass a path to search (use `.` with `-r` for the whole tree).
params:
  args: >-
    Arguments passed to `grep` (everything after the program name), one token per array
    element — e.g. ["-rn", "-E", "TODO", "."]. Runs in the project root. You MUST include a path
    to search (use `.` for the whole tree) — with no path the tool reads empty stdin and finds
    nothing. Output is plain (color disabled) and capped.
